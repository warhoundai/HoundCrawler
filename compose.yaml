services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: houndcrawler
      POSTGRES_DB: houndcrawler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U houndcrawler -d houndcrawler]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
  api:
    build:
      context: .
      args:
        HOUNDCRAWLER_EXTRAS: ${HOUNDCRAWLER_EXTRAS:-}
    ports: ["127.0.0.1:8081:8081"]
    environment:
      HOUNDCRAWLER_DATABASE_URL: postgresql://houndcrawler:${POSTGRES_PASSWORD}@postgres:5432/houndcrawler
      HOUNDCRAWLER_API_KEYS: ${HOUNDCRAWLER_API_KEYS}
      HOUNDCRAWLER_ENCRYPTION_KEY: ${HOUNDCRAWLER_ENCRYPTION_KEY}
      HOUNDCRAWLER_WEBHOOK_KEY: ${HOUNDCRAWLER_WEBHOOK_KEY}
      HOUNDBROWSER_ENDPOINT: ${HOUNDBROWSER_ENDPOINT:-}
      HOUNDBROWSER_SERVICE_KEY: ${HOUNDBROWSER_SERVICE_KEY}
      HOUNDCRAWLER_PARSER_ENDPOINT: ${HOUNDCRAWLER_PARSER_ENDPOINT:-}
      HOUNDCRAWLER_PARSER_KEY: ${HOUNDCRAWLER_PARSER_KEY}
      HOUNDCRAWLER_STORAGE: ${HOUNDCRAWLER_STORAGE:-/data}
      HOUNDCRAWLER_S3_ENDPOINT: ${HOUNDCRAWLER_S3_ENDPOINT:-}
      HOUNDCRAWLER_PRICING_JSON: ${HOUNDCRAWLER_PRICING_JSON:-{}}
      HOUNDCRAWLER_SMTP_HOST: ${HOUNDCRAWLER_SMTP_HOST:-}
      HOUNDCRAWLER_SMTP_FROM: ${HOUNDCRAWLER_SMTP_FROM:-}
      HOUNDCRAWLER_SMTP_PORT: ${HOUNDCRAWLER_SMTP_PORT:-587}
      HOUNDCRAWLER_SMTP_SSL: ${HOUNDCRAWLER_SMTP_SSL:-false}
      HOUNDCRAWLER_SMTP_USER: ${HOUNDCRAWLER_SMTP_USER:-}
      HOUNDCRAWLER_SMTP_PASSWORD: ${HOUNDCRAWLER_SMTP_PASSWORD:-}
      HOUNDCRAWLER_LLM_PROVIDER: ${HOUNDCRAWLER_LLM_PROVIDER:-openai}
      HOUNDCRAWLER_VERTEX_PROJECT: ${HOUNDCRAWLER_VERTEX_PROJECT:-}
      HOUNDCRAWLER_VERTEX_LOCATION: ${HOUNDCRAWLER_VERTEX_LOCATION:-global}
      HOUNDCRAWLER_LLM_OUTPUT_CONTROL: ${HOUNDCRAWLER_LLM_OUTPUT_CONTROL:-max_completion_tokens}
      HOUNDCRAWLER_LLM_ENDPOINT: ${HOUNDCRAWLER_LLM_ENDPOINT:-}
      HOUNDCRAWLER_LLM_MODEL: ${HOUNDCRAWLER_LLM_MODEL:-}
      HOUNDCRAWLER_LLM_KEY: ${HOUNDCRAWLER_LLM_KEY:-}
      HOUNDCRAWLER_SEARCH_PROVIDER: ${HOUNDCRAWLER_SEARCH_PROVIDER:-}
      HOUNDCRAWLER_SEARCH_KEY: ${HOUNDCRAWLER_SEARCH_KEY:-}
      HOUNDCRAWLER_SEARCH_ENDPOINT: ${HOUNDCRAWLER_SEARCH_ENDPOINT:-}
    volumes: [artifacts:/data]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
  browser:
    profiles: [browser]
    build: {context: ., dockerfile: Dockerfile.browser}
    environment:
      HOUNDBROWSER_SERVICE_KEY: ${HOUNDBROWSER_SERVICE_KEY}
    networks: [internal, egress]
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    tmpfs: [/tmp:size=512m,mode=1777]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
  parser:
    profiles: [parser]
    build: {context: ., dockerfile: Dockerfile.parser}
    environment:
      HOUNDCRAWLER_PARSER_KEY: ${HOUNDCRAWLER_PARSER_KEY}
      HF_HUB_OFFLINE: '1'
      DOCLING_ARTIFACTS_PATH: /models
    volumes: [parser-models:/models:ro]
    networks: [internal]
    mem_limit: 4g
    cpus: 2
    tmpfs: [/tmp:size=1g,mode=1777]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
networks:
  internal: {internal: true}
  egress: {}
volumes:
  postgres-data: {}
  artifacts: {}
  parser-models: {}
