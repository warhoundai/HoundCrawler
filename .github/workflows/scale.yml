name: Scale qualification
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  crawl-10k:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: test-only, POSTGRES_DB: houndcrawler_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HOUNDCRAWLER_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/houndcrawler_test
      HOUNDCRAWLER_SCALE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -q tests/test_scale.py
      - name: Qualification record
        if: always()
        run: cat benchmark-results/*.json || true
